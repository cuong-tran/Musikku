name: Build release APK (FOSS)
on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease

      - name: Check build-tools version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.BASE_64_SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true
        env:
            BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      # One file per ABI, so each can be downloaded on its own instead of
      # unpacking a zip holding all four.
      - name: Name APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src=(androidApp/build/outputs/apk/release/*-"$abi"-release*-signed.apk)
            if [ "${#src[@]}" -ne 1 ]; then
              echo "::error::Expected one signed $abi APK, found ${#src[@]}"
              exit 1
            fi
            cp "${src[0]}" "dist/Musikku-${version}-nightly-${GITHUB_SHA::7}-full-${abi}.apk"
          done
          ls -lh dist/

      # archive: false uploads the file as-is; the artifact takes the file's name.
      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-x86_64.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-universal.apk
          archive: false
          if-no-files-found: error
