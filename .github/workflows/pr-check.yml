name: Pull request check (compile and JVM tests)

# Compiles every platform and variant the release workflow ships, and stops there: no R8 or
# ProGuard, no lint, no Conveyor, no DMG, no signing, no artifacts. Its first run took 5.9 min,
# where the packaging workflows took 25-29 min for a pull request. What only those steps catch
# (keep rules, lint-vital, packaging) is still caught by android-release.yml on musikku.
#
# A fourth job, `test`, runs composeApp's JVM tests beside the compile jobs, so a pull request
# cannot break them unseen. The core submodule's own tests are not run: they have never run in CI.
#
# It needs no secrets, so a pull request from a fork runs it the same way. Full builds read
# local.properties inside a try/catch, so its absence only leaves Sentry, Last.fm and Discord
# keys empty, which compiling does not need.

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

# A new push to a pull request cancels the check still running for its previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One variant failing says nothing about the others, so let them all finish.
      fail-fast: false
      matrix:
        include:
          # androidApp and its vivo twin (com.spotify.music, Full only) in one Gradle run:
          # vivo compiles androidApp's sources, so most of its work is shared.
          - name: Android Full (app + vivo)
            full: 'true'
            tasks: >-
              :androidApp:compileReleaseKotlin :androidApp:compileReleaseJavaWithJavac
              :vivoAndroidApp:compileReleaseKotlin :vivoAndroidApp:compileReleaseJavaWithJavac
          # FOSS swaps in cast-empty, lastfm-empty and crashlytics-empty.
          - name: Android FOSS
            full: 'false'
            tasks: >-
              :androidApp:compileReleaseKotlin :androidApp:compileReleaseJavaWithJavac
          # Desktop ships as a Full build only.
          - name: Desktop (JVM)
            full: 'true'
            tasks: :desktopApp:compileKotlinJvm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=${{ matrix.full }}" >> ./gradle.properties

      - name: Compile
        run: ./gradlew ${{ matrix.tasks }}

  test:
    name: Run JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      # Desktop ships as a Full build only, and the tests run on the JVM target.
      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Run composeApp JVM tests
        run: ./gradlew :composeApp:jvmTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            composeApp/build/reports/tests/jvmTest/
            composeApp/build/test-results/jvmTest/
          if-no-files-found: ignore
