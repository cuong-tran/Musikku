name: Build APK for Release (Full & FOSS) && Desktop app release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'musikku'
    # A release tag, x.x.x or x.x.x.x (never vx.x.x: those are upstream's). The release job runs
    # only when the tag is on musikku; paths-ignore below is not applied to tag pushes.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  # Decides whether to build and whether to draft a release. A tag push drafts one only when the tag
  # is an x.x.x / x.x.x.x tag on musikku, checked now rather than once the builds are done: the
  # upstream sync tags musikku's tip and then rebases musikku, after which the tag is no longer on it.
  # A tag that is not on musikku builds nothing.
  gate:
    name: Check the trigger
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Release only for a version tag on musikku
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail
          out() { echo "build=$1" >> "$GITHUB_OUTPUT"; echo "release=$2" >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT" != push ] || [ "$REF_TYPE" != tag ]; then
            out true false
            exit 0
          fi
          if [ "$DELETED" = true ]; then
            echo "Tag $TAG was deleted: nothing to build."
            out false false
            exit 0
          fi
          if ! [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::notice::$TAG is not x.x.x or x.x.x.x: no build, no release."
            out false false
            exit 0
          fi
          # The commit the tag points at (an annotated tag is peeled), then whether musikku contains
          # it: comparing it with musikku answers "identical" or "ahead" exactly when it does.
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...musikku" --jq .status)
          case "$status" in
            identical|ahead)
              echo "Tag $TAG (${sha::7}) is on musikku: build and draft a release."
              out true true ;;
            *)
              echo "::notice::Tag $TAG (${sha::7}) is not on musikku ($status): no build, no release."
              out false false ;;
          esac

  build-full-release:
    name: Build full release version
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> ./local.properties

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Build full release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full

      # One file per ABI, so each can be downloaded on its own instead of
      # unpacking a zip holding all four.
      - name: Name APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src=(androidApp/build/outputs/apk/release/*-"$abi"-release.apk)
            if [ "${#src[@]}" -ne 1 ]; then
              echo "::error::Expected one signed $abi APK, found ${#src[@]}"
              exit 1
            fi
            cp "${src[0]}" "dist/musikku-${version}-full-${abi}.apk"
          done
          ls -lh dist/

      # archive: false uploads the file as-is; the artifact takes the file's name.
      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-x86_64.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-universal.apk
          archive: false
          if-no-files-found: error

  # SimpMusic for vivo: androidApp under a package vivo's Origin Island follows (vivoAndroidApp),
  # Full build, arm64-v8a only, signed with the same key so the official-build check accepts it.
  build-vivo-release:
    name: Build vivo release version
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> ./local.properties

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Build vivo release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --full --vivo

      # Named like the full release's APKs above. arm64-v8a only, so one file.
      - name: Name APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          mkdir -p dist
          src=(vivoAndroidApp/build/outputs/apk/release/*-release.apk)
          if [ "${#src[@]}" -ne 1 ]; then
            echo "::error::Expected one signed vivo APK, found ${#src[@]}"
            exit 1
          fi
          cp "${src[0]}" "dist/musikku-${version}-full-vivo-arm64-v8a.apk"
          ls -lh dist/

      # archive: false uploads the file as-is; the artifact takes the file's name.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.apk
          archive: false
          if-no-files-found: error

  build-foss-release:
    name: Build foss release version
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update environment variables
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run:
          echo $BASE_64_SIGNING_KEY | base64 -d > simpmusic.jks

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Build foss release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: Name APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            src=(androidApp/build/outputs/apk/release/*-"$abi"-release.apk)
            if [ "${#src[@]}" -ne 1 ]; then
              echo "::error::Expected one signed $abi APK, found ${#src[@]}"
              exit 1
            fi
            cp "${src[0]}" "dist/musikku-${version}-foss-${abi}.apk"
          done
          ls -lh dist/

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-x86_64.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-universal.apk
          archive: false
          if-no-files-found: error

  # composeApp's JVM tests (jvmTest + commonTest). draft-release needs this job, so a release is
  # never drafted with failing tests. The core submodule's own tests are not run here: they have
  # never run in CI.
  test:
    name: Run JVM tests
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Run composeApp JVM tests
        run: ./gradlew :composeApp:jvmTest

      # Not named musikku-*: draft-release downloads every artifact by that pattern.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            composeApp/build/reports/tests/jvmTest/
            composeApp/build/test-results/jvmTest/
          if-no-files-found: ignore

  build-desktop-packages:
    name: Build desktop packages (AppImage + Mac zip + Windows msix)
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Install libfuse2
        # Needed by appimagetool when wrapping the Linux app. Nothing else is
        # required here: mpvSetupAll only downloads and untars the prebuilt
        # native slices, so no 7-Zip, patchelf or dwarfs toolchain on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_JVM }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN_JVM }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate mpv-natives for all OSes
        # Conveyor is invoked by its own action further down, NOT through Gradle,
        # so the dependsOn(":composeApp:mpvSetupAll") wired into the conveyor*
        # tasks never fires on this path — the natives have to be staged here
        # explicitly or the installers ship without libmpv.
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        # Run writeConveyorConfig BEFORE Conveyor so the parser only reads
        # the static generated.conveyor.conf and never tastes Gradle stdout
        # (which can contain plugin println output and break HOCON parsing).
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      # Linux first: `make linux-app` emits the unpacked tree under output/
      # that our packageConveyorAppImage task wraps into a portable AppImage.
      # Conveyor 22.0 dropped native AppImage support, hence the wrap.
      - name: Run Conveyor (linux-app)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: -Kapp.machines=linux.amd64.glibc make linux-app
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      - name: Wrap Linux app tree → AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      # `make site` builds every machine that has non-empty targets +
      # `.appinstaller`, `.exe` wrapper, and the download.html landing
      # page. Conveyor wipes output/ at the start, so it does NOT clobber
      # the AppImage we already wrapped (that lives under
      # desktopApp/build/appimage/).
      #
      # `-Kapp.machines=...` restricts the site build to Mac + Windows.
      # Linux is excluded because we already produced the AppImage in
      # the previous step. Without this restriction, `make site` re-
      # enters Conveyor's Linux tarball pipeline as an intermediate even
      # when `linux.amd64.targets = []`, and that intermediate fails the
      # build with "Linux Tarball Contents for Intel" before the Mac /
      # Windows artifacts get a chance to run.
      - name: Run Conveyor (make site, Mac + Windows only)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=[mac.amd64,mac.aarch64,windows.amd64] make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}

      # packageConveyorAppImage writes Musikku-x86_64.AppImage. The copy takes the
      # version and a lowercase name, like the APKs, zips and DMGs.
      - name: Stage AppImage into output/ for upload
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          src=(desktopApp/build/appimage/conveyor/Musikku-*.AppImage)
          if [ "${#src[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage, found ${#src[@]}"
            exit 1
          fi
          cp "${src[0]}" "output/musikku-${version}-linux-x86_64.AppImage"

      - name: Show built artifacts
        run: ls -lh output/

      # archive: false uploads the file as-is; the artifact takes the file's name.
      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          path: output/musikku-*-linux-x86_64.AppImage
          archive: false
          if-no-files-found: error

      # Conveyor names its zips after app.fsname (simpmusic-<version>-mac-<arch>.zip).
      # Move them to musikku names, like the APKs and DMGs, one per arch.
      - name: Name macOS zips
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          mkdir -p mac-zips
          for arch in aarch64 amd64; do
            src=(output/*-mac-"$arch".zip)
            if [ "${#src[@]}" -ne 1 ]; then
              echo "::error::Expected one Mac $arch zip, found ${#src[@]}"
              exit 1
            fi
            mv "${src[0]}" "mac-zips/musikku-${version}-mac-${arch}.zip"
          done
          ls -lh mac-zips/

      # One artifact per Mac zip, uploaded as-is instead of inside another zip.
      # archive: false takes a single file and names the artifact after it.
      - name: Upload macOS zip (aarch64)
        uses: actions/upload-artifact@v7
        with:
          path: mac-zips/musikku-*-mac-aarch64.zip
          archive: false
          if-no-files-found: error

      - name: Upload macOS zip (amd64)
        uses: actions/upload-artifact@v7
        with:
          path: mac-zips/musikku-*-mac-amd64.zip
          archive: false
          if-no-files-found: error

      # Bundle Windows installer = install.bat + musikku.crt + msix.
      # Conveyor's default .exe wrapper + .appinstaller fetch URLs from
      # `site.base-url` (GitHub Releases /latest/download/) which 404 for
      # unreleased builds, so we ship our own scripts/windows/install.bat
      # that trusts the cert and sideloads the msix offline — no network
      # round-trip, double-click works, UAC self-elevates.
      #
      # Only x64 is shipped — windows.aarch64 is dropped because
      # androidx.sqlite-bundled lacks a Windows ARM64 native (see
      # conveyor.conf for full context). ARM Windows users get the x64
      # msix running under Prism emulation, which works correctly.
      #
      # Conveyor names the certificate and the msix after app.fsname
      # (simpmusic.crt, simpmusic-<version>.x64.msix). The bundle carries them
      # under musikku names, which are the ones install.bat looks for.
      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          if [ ! -f output/simpmusic.crt ]; then
            echo "::error::output/simpmusic.crt missing — Conveyor signing must have failed"
            exit 1
          fi
          msix=(output/simpmusic-*.x64.msix)
          if [ "${#msix[@]}" -ne 1 ]; then
            echo "::error::Expected one simpmusic-*.x64.msix in output/, found ${#msix[@]}"
            exit 1
          fi
          name="musikku-${version}-windows-x64"
          mkdir -p installers/
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat "$stage/"
          cp output/simpmusic.crt        "$stage/musikku.crt"
          cp "${msix[0]}"                "$stage/${name}.msix"
          ( cd "$stage" && zip -q -j \
            "${GITHUB_WORKSPACE}/installers/${name}-installer.zip" \
            install.bat musikku.crt "${name}.msix" )
          rm -rf "$stage"
          ls -lh installers/

      # archive: false uploads the zip as-is, so the download is the installer
      # zip itself, not a zip holding it. The artifact takes the file's name.
      - name: Upload Windows offline installer
        uses: actions/upload-artifact@v7
        with:
          path: installers/musikku-*-windows-x64-installer.zip
          archive: false
          if-no-files-found: error

  wrap-mac-dmg:
    name: Wrap macOS .zip → .dmg (installer UX)
    runs-on: macos-latest
    needs: build-desktop-packages
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install create-dmg + ImageMagick
        # create-dmg = sindresorhus brew formula. ImageMagick is used to
        # downscale the 2800x1600 source background to a sharp 1400x800
        # bitmap using a Lanczos filter (matches the DMG window size).
        run: brew install create-dmg imagemagick

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      # skip-decompress keeps each file a .zip: download-artifact unpacks
      # anything served as a zip, which would leave .app trees here instead of
      # the zips the loop below reads. merge-multiple puts both zips straight
      # into mac-zips/ rather than a folder per artifact.
      - name: Download Mac .zip artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: musikku-*-mac-*.zip
          path: mac-zips
          merge-multiple: true
          skip-decompress: true

      - name: Prepare background (Lanczos resize 2800x1600 → 1400x800)
        run: |
          mkdir -p build/dmg
          magick composeApp/icon/dmg-background.png \
            -filter Lanczos -resize 1400x800 \
            build/dmg/dmg-bg-1400x800.png

      - name: Wrap each Mac .zip into a polished .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          zips=(mac-zips/musikku-*-mac-*.zip)
          if [ "${#zips[@]}" -ne 2 ]; then
            echo "::error::Expected two Mac zips (aarch64 + amd64), found ${#zips[@]}"
            ls -la mac-zips || true
            exit 1
          fi
          for zip in "${zips[@]}"; do
            arch="$(basename "$zip" | sed -nE 's/.*-mac-([a-z0-9]+)\.zip/\1/p')"
            [[ -z "$arch" ]] && { echo "Cannot infer arch from $zip" >&2; exit 1; }
            workdir="$(mktemp -d)"
            unzip -q "$zip" -d "$workdir"
            app="$(find "$workdir" -maxdepth 2 -type d -name '*.app' | head -1)"
            [[ -d "$app" ]] || { echo "No .app inside $zip" >&2; exit 1; }
            out="dist/musikku-${VERSION}-mac-${arch}.dmg"
            scripts/wrap-mac-dmg.sh \
              "$app" \
              build/dmg/dmg-bg-1400x800.png \
              composeApp/icon/circle_app_icon.icns \
              "$out"
            rm -rf "$workdir"
          done
          ls -lh dist/

      # One artifact per .dmg, so each downloads on its own instead of inside a
      # zip holding both. archive: false names the artifact after the file.
      - name: Upload Mac .dmg (aarch64)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-mac-aarch64.dmg
          archive: false
          if-no-files-found: error

      - name: Upload Mac .dmg (amd64)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-mac-amd64.dmg
          archive: false
          if-no-files-found: error

  # Drafts the GitHub release for a version tag on musikku, with every file the jobs above uploaded
  # and notes built from the commit subjects since the previous release tag. A re-run that finds the
  # release already there only uploads the files again, so notes edited by hand are kept. It then
  # tags core's commit with the same name.
  draft-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: [gate, test, build-full-release, build-vivo-release, build-foss-release, build-desktop-packages, wrap-mac-dmg]
    if: needs.gate.outputs.release == 'true'
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # fetch-depth: 0 brings every tag, which the notes need to find the previous release.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Lets the notes tell upstream's commits from the fork's own. Without it they list every
      # commit under Musikku.
      - name: Fetch upstream SimpMusic
        run: |
          git fetch --no-tags https://github.com/maxrave-dev/SimpMusic.git \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/heads/dev:refs/remotes/upstream/dev' \
            || echo "::warning::Could not fetch upstream: the notes list every commit under Musikku"

      # skip-decompress keeps the zips (Mac apps, Windows installer) as zips; merge-multiple puts
      # every file straight into release-files/.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: musikku-*
          path: release-files
          merge-multiple: true
          skip-decompress: true

      - name: Check the release files
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          if [ "$version" != "$TAG" ]; then
            echo "::warning::Tag $TAG differs from version-name $version, which names the files"
          fi
          missing=0
          for f in \
            "full-arm64-v8a.apk" "full-armeabi-v7a.apk" "full-x86_64.apk" "full-universal.apk" \
            "foss-arm64-v8a.apk" "foss-armeabi-v7a.apk" "foss-x86_64.apk" "foss-universal.apk" \
            "full-vivo-arm64-v8a.apk" "linux-x86_64.AppImage" \
            "mac-aarch64.zip" "mac-amd64.zip" "mac-aarch64.dmg" "mac-amd64.dmg" \
            "windows-x64-installer.zip"; do
            name="musikku-${version}-${f}"
            if [ ! -f "release-files/$name" ]; then
              echo "::error::Missing $name"
              missing=1
            fi
          done
          ls -lh release-files/
          exit "$missing"

      - name: Draft release notes
        run: |
          set -euo pipefail
          bash scripts/musikku-release-notes.sh "$TAG" > release-notes.md
          cat release-notes.md

      - name: Create the draft release
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists: uploading the files again, notes left as they are"
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" release-files/* \
              --draft --verify-tag --title "Musikku $TAG" --notes-file release-notes.md
          fi

      # Puts the same tag on the core commit this tag's commit points at, in the repository
      # .gitmodules names, so the release's core stays reachable after a sync rebases core. The tag
      # is lightweight, like the app's. A core tag that already exists is left alone: fine when it
      # names the same commit, an error when it names another, since a tag is never moved.
      # GITHUB_TOKEN cannot write to another repository, so this takes CORE_TAG_TOKEN: a
      # fine-grained token with Contents read and write on the core repository only.
      - name: Tag core's commit
        env:
          GH_TOKEN: ${{ secrets.CORE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          url=$(git config -f .gitmodules submodule.core.url)
          core_repo=$(echo "$url" | sed -E 's~^(https://github\.com/|git@github\.com:)~~; s~\.git$~~; s~/$~~')
          core_sha=$(git rev-parse "HEAD:core")
          echo "Core: $core_repo at ${core_sha::7}"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CORE_TAG_TOKEN is not set: tag $core_repo ${core_sha} as $TAG by hand"
            exit 1
          fi
          existing=$(gh api "repos/${core_repo}/git/matching-refs/tags/${TAG}" \
            --jq ".[] | select(.ref == \"refs/tags/${TAG}\") | .object.type + \" \" + .object.sha")
          if [ -n "$existing" ]; then
            read -r type sha <<< "$existing"
            if [ "$type" = tag ]; then
              sha=$(gh api "repos/${core_repo}/git/tags/${sha}" --jq .object.sha)
            fi
            if [ "$sha" = "$core_sha" ]; then
              echo "::notice::$core_repo already has $TAG on ${core_sha::7}"
              exit 0
            fi
            echo "::error::$core_repo has $TAG on ${sha::7}, not on ${core_sha::7}: left as it is"
            exit 1
          fi
          status=$(gh api "repos/${core_repo}/compare/${core_sha}...musikku" --jq .status || echo unknown)
          case "$status" in
            identical|ahead) ;;
            *) echo "::warning::Core ${core_sha::7} is not on $core_repo musikku ($status); tagging it anyway" ;;
          esac
          gh api -X POST "repos/${core_repo}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${core_sha}" --jq .ref
          echo "Tagged $core_repo ${core_sha::7} as $TAG"
